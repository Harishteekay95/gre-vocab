<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GRE Vocab</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f6fb;--card:#fff;--text:#1c1c28;--muted:#6b6b80;--line:#e4e4ee;
  --accent:#4f46e5;--accent-soft:#eceafd;--good:#15803d;--good-soft:#dcfce7;--bad:#b91c1c;--bad-soft:#fee2e2;
  --radius:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f0f16;--card:#1a1a24;--text:#ececf3;--muted:#9a9ab0;--line:#2b2b3a;
  --accent:#8b85ff;--accent-soft:#262448;--good:#4ade80;--good-soft:#14321f;--bad:#f87171;--bad-soft:#3a1717;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;flex:1}
main{padding:0 16px 16px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn:disabled{opacity:.45}
.icon-btn{padding:8px;border-radius:10px;color:var(--muted);font-size:14px}
input,textarea,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:14px}
.chip.ant{background:var(--bad-soft);color:var(--bad)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin:8px 0 14px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
/* word list */
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.item .w{font-weight:650;font-size:17px}
.item .m{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .grow{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.dot.b1,.dot.b2{background:#f59e0b}.dot.b3,.dot.b4,.dot.b5{background:var(--good)}
.warn{font-size:12px;color:#b45309}
/* flashcard */
.flash{min-height:340px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}
.flash .front{text-align:center}
.flash .big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.flash h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.flash h4:first-child{margin-top:0}
.ex{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--accent-soft)}
.ex b{color:var(--accent)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grade .bad{background:var(--bad-soft);color:var(--bad)}.grade .good{background:var(--good-soft);color:var(--good)}
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
/* quiz */
.qtype{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.stem{font-size:18px;margin:8px 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.explain{margin-top:6px;font-size:15px}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:10px 0 12px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent);font-weight:600}
/* dialog */
dialog{border:0;border-radius:20px 20px 0 0;padding:0;width:100%;max-width:640px;margin:auto auto 0;background:var(--card);color:var(--text);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.dlg label{font-size:13px;color:var(--muted);display:block;margin-bottom:-4px}
.dlg h3{margin:0;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.stat{display:flex;gap:8px;margin:4px 0 0}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
</style>
</head>
<body>
<header>
  <h1 id="title">My Words</h1>
  <button class="icon-btn" id="installBtn" hidden>Install</button>
  <button class="icon-btn" id="menuBtn" aria-label="Sync and backup">Sync</button>
</header>

<main>
  <!-- WORDS -->
  <section class="view on" id="v-words">
    <form class="row" id="addForm" autocomplete="off">
      <input id="addInput" placeholder="Add a word you learned…" autocapitalize="none" spellcheck="false">
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="row" style="justify-content:space-between;margin-top:8px">
      <button class="icon-btn" id="bulkBtn">+ Add several at once</button>
      <button class="icon-btn" id="fillBtn" hidden>Fetch missing details</button>
    </div>
    <div class="stat" id="stats"></div>
    <input id="search" placeholder="Search your words" style="margin-top:12px" hidden>
    <div class="list" id="list"></div>
  </section>

  <!-- FLASHCARDS -->
  <section class="view" id="v-cards">
    <div class="seg" id="cardSeg">
      <button data-f="recent" class="on">Last 7 days</button><button data-f="all">All</button><button data-f="weak">Weak</button>
    </div>
    <div id="cardArea"></div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="v-quiz">
    <div id="quizArea"></div>
  </section>
</main>

<nav>
  <button data-v="words" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Words</button>
  <button data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>Flashcards</button>
  <button data-v="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg>GRE Practice</button>
</nav>

<!-- word editor -->
<dialog id="editDlg"><form class="dlg" id="editForm" method="dialog">
  <div class="row"><h3 id="edTitle" style="flex:1">New word</h3><span class="small muted" id="edStatus"></span></div>
  <label>Word</label><input id="f-word" required autocapitalize="none">
  <label>Part of speech</label><input id="f-pos" placeholder="adjective, noun, verb…">
  <label>Meaning</label><textarea id="f-meaning" rows="2"></textarea>
  <label>Synonyms (comma separated)</label><input id="f-syn">
  <label>Antonyms (comma separated)</label><input id="f-ant">
  <label>Example sentence 1</label><textarea id="f-ex1" rows="2"></textarea>
  <label>Example sentence 2</label><textarea id="f-ex2" rows="2"></textarea>
  <div class="row" style="margin-top:6px">
    <button type="button" class="btn line" id="edDelete">Delete</button>
    <button type="button" class="btn ghost" id="edFetch">Auto-fill</button>
    <span style="flex:1"></span>
    <button type="button" class="btn line" id="edCancel">Cancel</button>
    <button type="submit" class="btn" id="edSave">Save</button>
  </div>
</form></dialog>

<!-- bulk add -->
<dialog id="bulkDlg"><form class="dlg" method="dialog" id="bulkForm">
  <h3>Add several words</h3>
  <p class="small muted" style="margin:0">One per line or comma separated. Details are auto-filled when you're online; you can edit any word afterwards.</p>
  <textarea id="bulkText" rows="6" placeholder="laconic, obdurate, lionize"></textarea>
  <div class="row"><span style="flex:1"></span><button type="button" class="btn line" id="bulkCancel">Cancel</button><button class="btn" type="submit">Add all</button></div>
</form></dialog>

<!-- backup -->
<dialog id="menuDlg"><div class="dlg">
  <h3>Sync across devices</h3>
  <p class="small muted" style="margin:0" id="syncState">Sign in with the same Google account on your phone, laptop and tablet to see the same words everywhere.</p>
  <button class="btn" id="signInBtn">Sign in with Google</button>
  <button class="btn line" id="signOutBtn" hidden>Sign out</button>
  <h3 style="margin-top:8px">Backup</h3>
  <button class="btn ghost" id="exportBtn">Export words (.json)</button>
  <button class="btn ghost" id="importBtn">Import from backup</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <button class="btn line" id="menuClose">Close</button>
</div></dialog>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- built-in GRE words: used only as quiz distractors when your list is small ---------- */
const BUILTIN = `abate|verb|to lessen in intensity or amount
aberrant|adjective|departing from the usual or accepted standard
abscond|verb|to leave secretly to avoid arrest or responsibility
abstruse|adjective|difficult to understand; obscure
acerbic|adjective|sharp and forthright in tone
admonish|verb|to warn or reprimand firmly
adulterate|verb|to make impure by adding inferior substances
aggrandize|verb|to make greater in power, rank, or reputation
alacrity|noun|cheerful eagerness or readiness
ameliorate|verb|to make something bad better
anachronism|noun|something out of place in time
anomaly|noun|something that deviates from what is normal
antipathy|noun|a deep-seated feeling of dislike
apathy|noun|lack of interest or concern
appease|verb|to pacify by giving in to demands
arduous|adjective|requiring great effort; difficult
artless|adjective|without guile or deception; natural
assuage|verb|to make an unpleasant feeling less intense
audacious|adjective|showing a willingness to take bold risks
austere|adjective|severe or strict; plain and without decoration
banal|adjective|so lacking in originality as to be boring
bolster|verb|to support or strengthen
bombastic|adjective|high-sounding but with little meaning; inflated
cacophony|noun|a harsh, discordant mixture of sounds
capricious|adjective|given to sudden changes of mood or behavior
castigate|verb|to reprimand severely
censure|verb|to express severe disapproval of
chicanery|noun|the use of trickery to achieve a purpose
circumspect|adjective|wary and unwilling to take risks
cogent|adjective|clear, logical, and convincing
complacent|adjective|smugly satisfied and unaware of danger
conciliatory|adjective|intended to placate or pacify
connoisseur|noun|an expert judge in matters of taste
contentious|adjective|causing or likely to cause argument
convoluted|adjective|extremely complex and difficult to follow
corroborate|verb|to confirm or give support to a statement
credulous|adjective|too ready to believe things
dearth|noun|a scarcity or lack of something
deference|noun|humble submission and respect
denigrate|verb|to criticize unfairly; to belittle
desiccate|verb|to remove moisture from; to dry out
diatribe|noun|a forceful and bitter verbal attack
diffident|adjective|modest or shy due to lack of self-confidence
dilatory|adjective|slow to act; intended to cause delay
disparate|adjective|essentially different in kind
dogmatic|adjective|inclined to lay down principles as undeniably true
ebullient|adjective|cheerful and full of energy
eclectic|adjective|drawing from a wide range of sources
efficacy|noun|the ability to produce a desired result
enervate|verb|to cause someone to feel drained of energy
ephemeral|adjective|lasting for a very short time
equivocate|verb|to use ambiguous language to conceal the truth
erudite|adjective|having or showing great knowledge
esoteric|adjective|understood by only a small group of people
exacerbate|verb|to make a problem worse
exculpate|verb|to show or declare that someone is not guilty
fastidious|adjective|very attentive to accuracy and detail
fervent|adjective|having or displaying passionate intensity
fortuitous|adjective|happening by chance, often luckily
garrulous|adjective|excessively talkative
gregarious|adjective|fond of company; sociable
hackneyed|adjective|lacking significance through overuse
iconoclast|noun|a person who attacks cherished beliefs
idiosyncratic|adjective|peculiar to an individual
impetuous|adjective|acting quickly without thought or care
implacable|adjective|unable to be appeased or pacified
inchoate|adjective|just begun and not fully formed
indefatigable|adjective|persisting tirelessly
ingenuous|adjective|innocent and unsuspecting
intransigent|adjective|unwilling to change one's views
irascible|adjective|easily made angry
laudable|adjective|deserving praise
lethargic|adjective|sluggish and apathetic
loquacious|adjective|tending to talk a great deal
lucid|adjective|expressed clearly; easy to understand
magnanimous|adjective|generous or forgiving, especially toward a rival
mendacious|adjective|not telling the truth; lying
mitigate|verb|to make less severe or serious
mollify|verb|to appease the anger or anxiety of
munificent|adjective|more generous than is usual
obdurate|adjective|stubbornly refusing to change one's opinion
obsequious|adjective|excessively eager to please or obey
obviate|verb|to remove a need or difficulty
opaque|adjective|not able to be seen through; hard to understand
ostentatious|adjective|designed to impress through showy display
paucity|noun|the presence of something in small quantities
pedantic|adjective|excessively concerned with minor details or rules
penchant|noun|a strong liking or inclination
perfunctory|adjective|carried out with minimum effort or reflection
placate|verb|to make someone less angry or hostile
plethora|noun|a large or excessive amount
pragmatic|adjective|dealing with things sensibly and realistically
precipitate|verb|to cause something to happen suddenly
prodigal|adjective|spending money or resources freely and recklessly
propitiate|verb|to win or regain the favor of
prosaic|adjective|lacking imagination; dull
quiescent|adjective|in a state of inactivity or dormancy
recalcitrant|adjective|uncooperative toward authority
reticent|adjective|not revealing one's thoughts or feelings readily
sanguine|adjective|optimistic, especially in a difficult situation
soporific|adjective|tending to induce sleep
sycophant|noun|a person who flatters to gain advantage
taciturn|adjective|reserved or uncommunicative in speech
tenacious|adjective|holding firmly to something; persistent
torpor|noun|a state of physical or mental inactivity
truculent|adjective|eager or quick to argue or fight
venerate|verb|to regard with great respect
vindicate|verb|to clear someone of blame or suspicion
volatile|adjective|liable to change rapidly and unpredictably
zealot|noun|a person who is fanatical in pursuit of ideals`
  .split('\n').map(l => { const [word,pos,meaning] = l.split('|'); return {word,pos,meaning,synonyms:[],antonyms:[]}; });

/* ---------- storage ---------- */
const KEY = 'gre-vocab-v1';
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {words:[]}; } catch (e) { S = {words:[]}; }
if (!Array.isArray(S.words)) S.words = [];
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save on this device'); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s || '').trim().toLowerCase();
const list = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const DAY = 864e5;
let toastT;
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }
const findWord = w => S.words.find(x => norm(x.word) === norm(w));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function stemOf(w) { w = norm(w); return (w.length > 5 && /[ey]$/.test(w)) ? w.slice(0, -1) : w; }
function wordRegex(w) { const st = stemOf(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return new RegExp('\\b' + st + '[a-z]*', 'i'); }
function highlight(sentence, w) { const s = esc(sentence); const re = wordRegex(w); return s.replace(re, m => '<b>' + m + '</b>'); }
function blank(sentence, w) { const re = wordRegex(w); return re.test(sentence) ? sentence.replace(re, '_____') : null; }

/* ---------- free, keyless lookups (no AI) ---------- */
async function getJSON(url, ms = 8000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {signal: c.signal}); if (!r.ok) return null; return await r.json(); }
  catch (e) { return null; } finally { clearTimeout(t); }
}
function stripHtml(h) { const d = document.createElement('div'); d.innerHTML = h || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }

// --- tiny Wiktionary wikitext reader: synonyms, antonyms, usage examples, quotations ---
function wtTemplates(s, test) { // top-level {{...}} blocks whose name passes test
  const out = [];
  for (let i = 0; i < s.length - 1; i++) {
    if (s[i] !== '{' || s[i + 1] !== '{') continue;
    let d = 0, j = i;
    for (; j < s.length - 1; j++) {
      if (s[j] === '{' && s[j + 1] === '{') { d++; j++; } else if (s[j] === '}' && s[j + 1] === '}') { d--; j++; if (!d) break; }
    }
    const body = s.slice(i + 2, j - 1);
    if (test(body.split('|')[0].trim())) out.push(body);
    i = j;
  }
  return out;
}
function wtParams(body) { // split on | that are not inside {{ }} or [[ ]]
  const p = []; let d = 0, cur = '';
  for (let i = 0; i < body.length; i++) {
    const two = body.slice(i, i + 2);
    if (two === '{{' || two === '[[') { d++; cur += two; i++; continue; }
    if (two === '}}' || two === ']]') { d--; cur += two; i++; continue; }
    if (body[i] === '|' && !d) { p.push(cur); cur = ''; continue; }
    cur += body[i];
  }
  p.push(cur); return p.map(x => x.trim());
}
function wtClean(s) {
  s = s.replace(/<!--[\s\S]*?-->/g, '').replace(/<ref[\s\S]*?(<\/ref>|\/>)/g, '');
  for (let k = 0; k < 4; k++) s = s.replace(/\{\{([^{}]*)\}\}/g, (m, b) => { const p = b.split('|'); return /^(w|l|m|lang|smallcaps|gloss|nowrap)$/.test(p[0].trim()) ? (p[p.length - 1].includes('=') ? p[1] || '' : p[p.length - 1]) : ''; });
  s = s.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, '$1').replace(/'{2,}/g, '').replace(/<[^>]+>/g, '');
  return s.replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').replace(/\s+([,.;:!?])/g, '$1').trim();
}
function wtWords(body) { // {{syn|en|a|b<q:x>|Thesaurus:y}} -> [a, b]
  return wtParams(body).slice(2).filter(x => x && !x.includes('=') && !/^Thesaurus:/i.test(x)).map(x => wtClean(x.split('<')[0])).filter(Boolean);
}
function readWikitext(wt) {
  const res = {synonyms: [], antonyms: [], examples: [], quotes: []};
  if (!wt) return res;
  const a = wt.indexOf('==English=='); if (a < 0) return res;
  const rest = wt.slice(a + 11); const b = rest.search(/\n==[^=]/);
  const en = b < 0 ? rest : rest.slice(0, b);
  // first definition that isn't obsolete/archaic, with its part of speech
  let pos = '';
  for (const line of en.split('\n')) {
    const h = line.match(/^===+\s*(Noun|Verb|Adjective|Adverb)\s*===+/); if (h) { pos = h[1].toLowerCase(); continue; }
    if (!pos || !/^# /.test(line)) continue;
    const labels = wtTemplates(line, n => /^(lb|lbl|label)$/.test(n)).join('|');
    const def = wtClean(line.slice(2));
    if (def.length < 3) continue;
    if (!res.anyMeaning) res.anyMeaning = {meaning: def, pos};
    if (/obsolete|archaic|dated|historical|rare|nonstandard/i.test(labels)) continue;
    res.meaning = def; res.pos = pos; break;
  }
  wtTemplates(en, n => /^(syn|synonyms)$/.test(n)).forEach(t => res.synonyms.push(...wtWords(t)));
  wtTemplates(en, n => /^(ant|antonyms)$/.test(n)).forEach(t => res.antonyms.push(...wtWords(t)));
  // ====Synonyms==== / ====Antonyms==== sections
  for (const [key, re] of [['synonyms', /====\s*Synonyms\s*====([\s\S]*?)(?=\n=)/g], ['antonyms', /====\s*Antonyms\s*====([\s\S]*?)(?=\n=)/g]]) {
    let m; while ((m = re.exec(en))) wtTemplates(m[1], n => /^(l|sense)$/.test(n)).forEach(t => { const p = wtParams(t); if (p[0] === 'l' && p[2]) res[key].push(wtClean(p[2])); });
  }
  wtTemplates(en, n => /^(ux|uxi|usex)$/.test(n)).forEach(t => { const p = wtParams(t).filter(x => !x.includes('=')); if (p[2]) res.examples.push(wtClean(p[2])); });
  wtTemplates(en, n => /^quote-/.test(n)).forEach(t => {
    const p = wtParams(t).find(x => /^(passage|text)\s*=/.test(x));
    if (p) res.quotes.push(wtClean(p.replace(/^(passage|text)\s*=/, '')));
  });
  return res;
}

async function lookup(word) {
  const q = encodeURIComponent(norm(word));
  const [dict, syn, ant, wik, raw, tat] = await Promise.all([
    getJSON('https://api.dictionaryapi.dev/api/v2/entries/en/' + q, 5000),
    getJSON('https://api.datamuse.com/words?rel_syn=' + q + '&max=10'),
    getJSON('https://api.datamuse.com/words?rel_ant=' + q + '&max=6'),
    getJSON('https://en.wiktionary.org/api/rest_v1/page/definition/' + q + '?redirect=true'),
    getJSON('https://en.wiktionary.org/w/api.php?action=parse&page=' + q + '&prop=wikitext&redirects=1&format=json&origin=*'),
    getJSON('https://api.tatoeba.org/unstable/sentences?lang=eng&sort=relevance&limit=20&q=' + q),
  ]);
  const out = {pos: '', meaning: '', synonyms: [], antonyms: [], examples: []};
  const add = (arr, v) => { v = String(v || '').trim(); if (v && /[a-z]/i.test(v) && v.length < 40 && norm(v) !== norm(word) && !arr.some(x => norm(x) === norm(v))) arr.push(v); };
  const ex = []; // [sentence, priority]
  let any = false;
  if (Array.isArray(dict)) {
    any = true;
    for (const e of dict) for (const m of (e.meanings || [])) {
      if (!out.pos) out.pos = m.partOfSpeech || '';
      for (const d of (m.definitions || [])) {
        if (!out.meaning && d.definition) out.meaning = d.definition;
        if (d.example) ex.push([d.example, 0]);
        (d.synonyms || []).forEach(s => add(out.synonyms, s));
        (d.antonyms || []).forEach(s => add(out.antonyms, s));
      }
      (m.synonyms || []).forEach(s => add(out.synonyms, s));
      (m.antonyms || []).forEach(s => add(out.antonyms, s));
    }
  }
  const w = readWikitext(raw && raw.parse && raw.parse.wikitext && raw.parse.wikitext['*']);
  if (!out.meaning && (w.meaning || w.anyMeaning)) { const m = w.meaning ? w : w.anyMeaning; out.meaning = m.meaning; out.pos = out.pos || m.pos; any = true; }
  if (wik && Array.isArray(wik.en)) {
    for (const p of wik.en) for (const d of (p.definitions || [])) {
      const def = stripHtml(d.definition);
      if (!out.meaning && def) { any = true; out.meaning = def; if (!out.pos) out.pos = (p.partOfSpeech || '').toLowerCase(); }
      (d.parsedExamples || []).forEach(x => ex.push([stripHtml(x.example), 1]));
      (d.examples || []).forEach(x => ex.push([stripHtml(x), 1]));
    }
  }
  w.synonyms.forEach(s => add(out.synonyms, s));
  w.antonyms.forEach(s => add(out.antonyms, s));
  w.examples.forEach(s => ex.push([s, 1]));
  if (tat && Array.isArray(tat.data)) tat.data.forEach(x => ex.push([x.text, 2]));
  w.quotes.forEach(s => ex.push([s, 3]));
  if (Array.isArray(syn)) { any = any || syn.length > 0; syn.forEach(x => add(out.synonyms, x.word)); }
  if (Array.isArray(ant)) ant.forEach(x => add(out.antonyms, x.word));
  // keep readable sentences that actually use the word; prefer modern, mid-length ones
  const re = wordRegex(word), seen = new Set();
  out.examples = ex.map(([s, p]) => [String(s || '').replace(/\s+/g, ' ').trim(), p])
    .filter(([s]) => s.length >= 15 && s.length <= 220 && re.test(s) && !/^\(/.test(s) && !seen.has(norm(s)) && seen.add(norm(s)))
    .sort((a, b) => (a[1] - b[1]) || (Math.abs(a[0].length - 80) - Math.abs(b[0].length - 80)))
    .map(x => x[0]);
  // two different sentences, ideally from different sources
  if (out.examples.length > 2) out.examples = [out.examples[0], out.examples.find((s, i) => i > 0 && s.split(' ').length > 5) || out.examples[1]];
  out.synonyms = out.synonyms.slice(0, 6);
  out.antonyms = out.antonyms.slice(0, 4);
  out.examples = out.examples.slice(0, 2);
  out.found = any && !!out.meaning;
  return out;
}

function newWord(w) {
  return {id: uid(), word: w.trim(), pos: '', meaning: '', synonyms: [], antonyms: [], examples: [], addedAt: Date.now(), box: 0, seen: 0, correct: 0, lastSeen: 0};
}
function applyLookup(w, r, overwrite) {
  for (const k of ['pos', 'meaning']) if (overwrite || !w[k]) w[k] = r[k] || w[k];
  for (const k of ['synonyms', 'antonyms', 'examples']) if (overwrite || !w[k].length) w[k] = r[k].length ? r[k] : w[k];
}

function grade(w, ok) {

/* ---------- GRE-style practice (generated on the phone, no AI) ---------- */
let quizFilter = 'recent', Q = [], qi = 0, score = 0, missed = [];
function renderQuizHome() {
  const A = $('#quizArea');
  const n = {recent: pool('recent').length, all: pool('all').length, weak: pool('weak').length};
  A.innerHTML = `
    <p class="muted" style="margin-top:4px">Questions are built from your own words in GRE formats: definitions, synonyms, antonyms, Text Completion and Sentence Equivalence (pick two).</p>

  A.querySelectorAll('#qSeg button').forEach(b => {

  });

  $('#qStart').onclick = () => startQuiz(pool(quizFilter));

function distractors(target, n, filterFn) {
  const bank = S.words.filter(w => w !== target && w.meaning);
  const syn = new Set(target.synonyms.map(norm).concat(target.antonyms.map(norm)));
  const ok = w => norm(w.word) !== norm(target.word) && !syn.has(norm(w.word)) && !(w.synonyms || []).map(norm).includes(norm(target.word)) && (!filterFn || filterFn(w));
  let a = shuffle(bank.filter(ok));
  if (a.length < n) a = a.concat(shuffle(BUILTIN.filter(b => ok(b) && !a.some(x => norm(x.word) === norm(b.word)))));
  return a.slice(0, n);
}
function samePos(target) { const p = norm(target.pos); return w => !p || !w.pos || norm(w.pos) === p; }
function single(arr) { return arr.filter(s => !/\s/.test(s)); }

function makeQuestion(w) {
  const types = ['def'];
  if (single(w.synonyms).length) types.push('syn', 'syn');
  if (single(w.antonyms).length) types.push('ant');
  const sents = w.examples.map(s => blank(s, w.word)).filter(Boolean);
  if (sents.length) types.push('tc', 'tc');
  if (sents.length && single(w.synonyms).length) types.push('se', 'se');
  const t = pick(types);
  if (t === 'def') {
    const opts = shuffle([{text: w.meaning, ok: true}, ...distractors(w, 4).map(d => ({text: d.meaning, ok: false}))]);
    return {w, type: 'Meaning', stem: `Which of the following best defines <b>${esc(w.word)}</b>?`, opts};
  }
  if (t === 'syn' || t === 'ant') {
    const ans = pick(single(t === 'syn' ? w.synonyms : w.antonyms));
    const opts = shuffle([{text: ans, ok: true}, ...distractors(w, 4, samePos(w)).map(d => ({text: d.word, ok: false}))]);
    return {w, type: t === 'syn' ? 'Synonym' : 'Antonym',
      stem: `Select the word most nearly <b>${t === 'syn' ? 'similar' : 'opposite'}</b> in meaning to <b>${esc(w.word)}</b>.`, opts};
  }
  const sent = pick(sents);
  if (t === 'tc') {
    const opts = shuffle([{text: w.word, ok: true}, ...distractors(w, 4, samePos(w)).map(d => ({text: d.word, ok: false}))]);
    return {w, type: 'Text Completion', stem: esc(sent).replace('_____', '<b>_____</b>'), opts};
  }
  // Sentence Equivalence: choose the two words that give sentences alike in meaning
  const syn = pick(single(w.synonyms));
  const trap = single(w.antonyms).length ? [{text: pick(single(w.antonyms)), ok: false}] : [];
  const opts = shuffle([{text: w.word, ok: true}, {text: syn, ok: true}, ...trap,
    ...distractors(w, 4 - trap.length, samePos(w)).map(d => ({text: d.word, ok: false}))]);
  return {w, type: 'Sentence Equivalence', multi: true,
    stem: esc(sent).replace('_____', '<b>_____</b>') + '<div class="small muted" style="margin-top:6px">Select the <b>two</b> answer choices that complete the sentence and produce sentences alike in meaning.</div>', opts};
}

function startQuiz(words) {
  let order = shuffle(words).sort((a, b) => (a.box || 0) - (b.box || 0));
  const chosen = [];
  while (chosen.length < 10 && order.length) { chosen.push(...order.slice(0, 10 - chosen.length)); if (words.length < 10) order = shuffle(words); else break; }
  Q = shuffle(chosen).map(makeQuestion); qi = 0; score = 0; missed = [];
  renderQ();
}
function renderQ() {
  const A = $('#quizArea');
  if (qi >= Q.length) {
    const uniq = [...new Set(missed)];
    A.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:40px;font-weight:800">${score} / ${Q.length}</div>
      <p class="muted">${score === Q.length ? 'Perfect round!' : 'Words to revisit:'}</p>
      ${uniq.length ? `<div class="chips" style="justify-content:center;margin-bottom:14px">${uniq.map(w => `<span class="chip ant">${esc(w.word)}</span>`).join('')}</div>` : ''}
      <div class="row" style="justify-content:center;flex-wrap:wrap">
        ${uniq.length ? `<button class="btn ghost" id="qReview">Review these as flashcards</button>` : ''}
        <button class="btn" id="qAgain">New round</button></div></div>`;
    $('#qAgain').onclick = renderQuizHome;
    if (uniq.length) $('#qReview').onclick = () => { show('cards'); startCards(uniq); };
    return;
  }
  const q = Q[qi], L = 'ABCDEF';
  const sel = new Set();
  A.innerHTML = `<div class="progress"><i style="width:${qi / Q.length * 100}%"></i></div>
    <div class="row" style="justify-content:space-between"><span class="qtype">${q.type}</span><span class="small muted">${qi + 1} / ${Q.length}</span></div>
    <div class="stem">${q.stem}</div>
    <div id="opts">${q.opts.map((o, i) => `<button class="opt" data-i="${i}">${q.multi ? `<span class="l" style="border-radius:6px">&nbsp;</span>` : `<span class="l">${L[i]}</span>`}<span>${esc(o.text)}</span></button>`).join('')}</div>
    ${q.multi ? `<button class="btn" id="qCheck" style="width:100%" disabled>Check</button>` : ''}
    <div id="after"></div>`;
  const btns = [...A.querySelectorAll('.opt')];
  let answered = false;
  function reveal(chosen) {
    answered = true;
    const right = q.opts.every((o, i) => o.ok === chosen.has(i));
    btns.forEach((b, i) => { if (q.opts[i].ok) b.classList.add('right'); else if (chosen.has(i)) b.classList.add('wrong'); b.disabled = true; });
    if (right) score++; else missed.push(q.w);
    grade(q.w, right);
    if (q.multi) $('#qCheck').remove();
    $('#after').innerHTML = `<div class="card explain" style="margin:6px 0 12px;border-color:${right ? 'var(--good)' : 'var(--bad)'}">
      <div style="font-weight:700;color:${right ? 'var(--good)' : 'var(--bad)'}">${right ? 'Correct' : 'Not quite'}</div>
      <div style="margin-top:4px"><b>${esc(q.w.word)}</b> <span class="small muted">${esc(q.w.pos)}</span> — ${esc(q.w.meaning)}</div>
      ${q.w.synonyms.length ? `<div class="small muted" style="margin-top:4px">Synonyms: ${esc(q.w.synonyms.join(', '))}</div>` : ''}
      ${q.w.antonyms.length ? `<div class="small muted">Antonyms: ${esc(q.w.antonyms.join(', '))}</div>` : ''}
    </div><button class="btn" id="qNext" style="width:100%">${qi + 1 < Q.length ? 'Next' : 'See results'}</button>`;
    $('#qNext').onclick = () => { qi++; renderQ(); window.scrollTo(0, 0); };
  }
  btns.forEach((b, i) => b.onclick = () => {
    if (answered) return;
    if (!q.multi) { reveal(new Set([i])); return; }
    if (sel.has(i)) sel.delete(i); else if (sel.size < 2) sel.add(i);
    btns.forEach((x, j) => { x.classList.toggle('sel', sel.has(j)); x.querySelector('.l').innerHTML = sel.has(j) ? '✓' : '&nbsp;'; });
    $('#qCheck').disabled = sel.size !== 2;
  });
  if (q.multi) $('#qCheck').onclick = () => reveal(sel);
}

/* ---------- backup ---------- */
$('#menuClose').onclick = () => $('#menuDlg').close();
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({app: 'gre-vocab', version: 1, exportedAt: new Date().toISOString(), words: S.words}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'gre-words-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const arr = Array.isArray(data) ? data : data.words;
    const added = [];
    for (const x of arr || []) {
      if (!x || !x.word || findWord(x.word)) continue;
      const w = Object.assign(newWord(x.word), x, {id: x.id || uid()});
      for (const k of ['synonyms', 'antonyms', 'examples']) if (!Array.isArray(w[k])) w[k] = [];
      delete w.updatedAt; S.words.push(w); added.push(w);
    }
    changed(added); renderWords(); $('#menuDlg').close(); toast('Imported ' + added.length + ' new word(s)');
  } catch (err) { toast('That file could not be read'); }
  e.target.value = '';
};

/* ---------- sync across devices: Firebase (free) + Sign in with Google ---------- */
// Words stay saved on the device first (works offline); when signed in, each word is
// also stored at users/<your id>/words/<word> in Firestore, and every device listens for changes.
const FB_CONFIG = {
  apiKey: 'AIzaSyDubZ_v0KNFn81V1gwyObWQJWfITdlspMY',
  authDomain: 'gre-vocab-8a375.firebaseapp.com',
  projectId: 'gre-vocab-8a375',
  storageBucket: 'gre-vocab-8a375.firebasestorage.app',
  messagingSenderId: '935140086488',
  appId: '1:935140086488:web:3114c17c0f97d0ac81fdad'
};
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
let fb = null, fbLoading = null, fbUser = null, fbUnsub = null, remoteReady = false;
if (!S.deleted || typeof S.deleted !== 'object') S.deleted = {};

const docKey = w => (norm(w).replace(/\//g, '∕').replace(/^\.\.?$/, '_') || '_').slice(0, 200);
function changed(words) {
  const now = Date.now();
  for (const w of [].concat(words)) { w.updatedAt = now; delete S.deleted[docKey(w.word)]; push(w); }
  save();
}
function removedKey(k) { S.deleted[k] = Date.now(); save(); pushDelete(k); }

function wordRef(k) { return fb.F.doc(fb.db, 'users', fbUser.uid, 'words', k); }
function push(w) {
  if (!fb || !fbUser || !remoteReady) return; // pushed later, when the first sync completes
  if (!w.updatedAt) w.updatedAt = w.addedAt || Date.now();
  const data = JSON.parse(JSON.stringify(w)); delete data.deleted;
  fb.F.setDoc(wordRef(docKey(w.word)), data).catch(e => setSync('error', e));
}
function pushDelete(k) {
  if (!fb || !fbUser || !remoteReady) return;
  fb.F.setDoc(wordRef(k), {deleted: true, updatedAt: S.deleted[k] || Date.now()}).catch(e => setSync('error', e));
}

function applyRemote(snap) {
  if (!remoteReady && snap.metadata.fromCache) return; // wait for the server's copy before the first merge
  let dirty = false;
  const remote = {};
  snap.forEach(d => {
    const r = d.data(), k = d.id, rt = r.updatedAt || 0;
    remote[k] = rt;
    const local = S.words.find(w => docKey(w.word) === k);
    const lt = local ? (local.updatedAt || 0) : (S.deleted[k] || 0);
    if (rt <= lt) return; // this device already has the newest version
    if (r.deleted) {
      if (local) { S.words = S.words.filter(w => w !== local); dirty = true; }
      S.deleted[k] = rt; return;
    }
    const w = Object.assign(local || {}, r);
    for (const f of ['synonyms', 'antonyms', 'examples']) if (!Array.isArray(w[f])) w[f] = [];
    if (!local) S.words.push(w);
    delete S.deleted[k]; dirty = true;
  });
  if (!remoteReady) { // first sync after sign-in: upload what only this device has, or has newer
    remoteReady = true;
    S.words.forEach(w => { const k = docKey(w.word); if (!(k in remote) || (w.updatedAt || 0) > remote[k]) push(w); });
    Object.entries(S.deleted).forEach(([k, t]) => { if (k in remote && t > remote[k]) pushDelete(k); });
    setSync('on');
  }
  if (dirty) { save(); if (current === 'words') renderWords(); if (current === 'quiz' && !Q.length) renderQuizHome(); }
}

function setSync(state, err) {
  const name = fbUser && (fbUser.displayName || fbUser.email) || '';
  const btn = $('#menuBtn'), st = $('#syncState');
  $('#signInBtn').hidden = state === 'on' || state === 'connecting';
  $('#signOutBtn').hidden = !(state === 'on' || state === 'connecting');
  $('#signInBtn').disabled = false;
  if (state === 'on') { btn.textContent = '✓ Synced'; st.textContent = 'Signed in as ' + name + '. Words you add or practise sync to your other devices.'; }
  else if (state === 'connecting') { btn.textContent = 'Syncing…'; st.textContent = 'Signed in as ' + name + '. Syncing…'; }
  else if (state === 'error') { btn.textContent = 'Sync'; st.textContent = 'Sync problem: ' + ((err && (err.code || err.message)) || 'unknown') + '. Your words are still saved on this device.'; }
  else { btn.textContent = 'Sync'; st.textContent = 'Sign in with the same Google account on your phone, laptop and tablet to see the same words everywhere.'; }
}

function fbLoad() {
  if (fbLoading) return fbLoading;
  if (FB_CONFIG.apiKey.startsWith('__')) return Promise.reject(new Error('not set up'));
  fbLoading = Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(FB_SDK + f)))
    .then(([app, A, F]) => {
      const a = app.initializeApp(FB_CONFIG);
      fb = {auth: A.getAuth(a), db: F.getFirestore(a), A, F};
      A.onAuthStateChanged(fb.auth, onUser);
      A.getRedirectResult(fb.auth).catch(() => {});
      return fb;
    })
    .catch(e => { fbLoading = null; throw e; });
  return fbLoading;
}
function onUser(u) {
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  fbUser = u; remoteReady = false;
  try { u ? localStorage.setItem('gre-sync', '1') : localStorage.removeItem('gre-sync'); } catch (e) {}
  if (!u) { setSync('off'); return; }
  setSync('connecting');
  fbUnsub = fb.F.onSnapshot(fb.F.collection(fb.db, 'users', u.uid, 'words'), {includeMetadataChanges: true}, applyRemote, e => setSync('error', e));
}

$('#menuBtn').onclick = () => { $('#menuDlg').showModal(); if (navigator.onLine) fbLoad().catch(() => {}); };
$('#signInBtn').onclick = async () => {
  if (!navigator.onLine) { toast('Connect to the internet to sign in'); return; }
  $('#signInBtn').disabled = true;
  try {
    await fbLoad();
    try { await fb.A.signInWithPopup(fb.auth, new fb.A.GoogleAuthProvider()); }
    catch (e) {
      if (/popup-blocked|operation-not-supported/.test(e.code || '')) await fb.A.signInWithRedirect(fb.auth, new fb.A.GoogleAuthProvider());
      else if (!/popup-closed|cancelled-popup/.test(e.code || '')) throw e;
    }
  } catch (e) { setSync('error', e); }
  $('#signInBtn').disabled = false;
};
$('#signOutBtn').onclick = async () => { if (fb) await fb.A.signOut(fb.auth); toast('Signed out. Your words stay on this device.'); };
// reconnect automatically on devices that signed in before
function autoSync() { try { if (localStorage.getItem('gre-sync') && navigator.onLine) fbLoad().catch(() => {}); } catch (e) {} }
window.addEventListener('online', autoSync);
autoSync();

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installBtn').hidden = false; });
$('#installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#installBtn').hidden = true; };
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

show('words');
</script>
